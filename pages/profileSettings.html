<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chwila Skupienia</title>
    <link rel="stylesheet" href="../css/styles.css">

</head>
<body>
    <div class="profileSettingsMainContainer">
        <button>darkmode<img src="../assets/img/moon-regular.svg"></button>
        <div class="navBar">
            <ul>
                <li><a href="dashboardPage.html">Minutnik</a></li>
                <li><a href="profilePage.html">Profil</a></li>
            </ul>
        </div>
        <div class="userProfile">
            <div class="profileHeader">
                <div class="avatar"><img src="../assets/img/user-solid.svg" id="avatar"></div>
                <div class="userName">@Typowy_user</div>
            </div>
            <div class="settingsContainer">
                <a href="profilePage.html">Wróć do profilu</a>
                <label>Zmień zdjęcie profilowe:</label>
                    <input type="file" accept="image/jpeg,image/png,image/jpg" id="avatarFile" name="avatarFile"></input>
                    <button id="submitAvatar">Potwierdź</button>
                <label>Zmień adres e-mail:</label>
                    <input type="text" id="emailChangeField"></input>
                    <button id="emailChangeConfirmBtn">Potwierdź</button>
                <label>Zmień nazwę użytkownika:</label>
                    <input type="text"></input>
                    <button>Potwierdź</button>
                <label>Zmień hasło:</label>
                    <input type="text" placeholder="Podaj stare hasło"></input>
                    <input type="text" placeholder="Podaj nowe hasło"></input>
                    <button>Potwierdź</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    

    <script src="../js/firebase.js" defer></script>
    <script src="../js/profileSettings.js"></script>
</body>
</html>
