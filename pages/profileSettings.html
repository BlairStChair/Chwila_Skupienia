<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chwila Skupienia</title>
    <link rel="stylesheet" href="../css/styles.css">

</head>
<body>
    <div class="profileSettingsMainContainer">
        <button class="darkmode-toggle">
            <img src="../assets/img/moon-regular.svg" alt="Tryb nocny" class="moon-icon" />
            <img src="../assets/img/sun-solid-white.svg" alt="Tryb dzienny" class="sun-icon" />
            </button>
                <div class="navBar">
                <!-- Zamiast listy są buttony normalnie, zamieniłam żeby było wygodniej układać w css  -->
                <div class="navBar-wrapper">
                <img class="diamond" src="../assets/img/diament-white.svg" alt="diament" />
                <a href="dashboardPage.html" class="navBtn" >Minutnik</a>
                <img class="bigdiamond" src="../assets/img/diament-diament-white.svg" alt="diament" />
                <a href="profilePage.html" class="navBtn">Profil</a>
                <img class="diamond"  src="../assets/img/diament-white.svg" alt="diament" />
                </div>
        </div>
            <div class="nav-lines">
                <div class="nav-decor-line"></div>
            </div>
        <div class="profileSettingsContainer">
            <div class="profileHeader">
                <div class="left">
                    <div class="avatar"><img src="../assets/img/user-solid.svg" id="avatar"></div>
                    <div class="userName"><p id="userName">@TypowyUser</p></div>
                </div>
                <div class="settings">
                    <a href="profilePage.html" class="button-link2">Wróć do profilu</a>
                </div>
            </div>
                        <div class="profiledecorline"></div>
            
            <div class="settingsContainer">
                <label>Zmień zdjęcie profilowe:</label>
                    <input type="file" accept="image/jpeg,image/png,image/jpg" id="avatarFile" name="avatarFile"></input>
                    <button id="submitAvatar">Potwierdź</button>
                <label>Zmień adres e-mail:</label>
                    <input type="password" class="emailChangePasswordConfirm" placeholder="Podaj hasło, aby potwierdzić">
                    <input type="text" id="emailChangeField" placeholder="Podaj nowy adres e-mail"></input>
                    <button id="emailChangeConfirmBtn">Potwierdź</button>
                <label>Zmień nazwę użytkownika:</label>
                    <input type="text" id="usernameChangeField" placeholder="Podaj nową nazwę użytkownika"></input>
                    <button id="usernameChangeBtn">Potwierdź</button>
                <label>Zmień hasło:</label>
                    <input type="password"  id="oldPasswordField" placeholder="Podaj stare hasło"></input>
                    <input type="password" id="newPasswordField" placeholder="Podaj nowe hasło"></input>
                    <input type="password" id="newPasswordConfirmField" placeholder="Wprowadź nowe hasło ponownie"></input>
                    <button id="passwordChangeBtn">Potwierdź</button>
            </div>
        </div>
    </div>
                <div class="logoutWrapper">
            <button class="logoutBtn">
                <img src="../assets/img/logout.svg" alt="Wyloguj">
            </button>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    

    <script src="../js/firebase.js" defer></script>
    <script src="../js/profileSettings.js"></script>
   

</body>
</html>
