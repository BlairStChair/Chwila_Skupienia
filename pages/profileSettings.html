<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chwila Skupienia</title>
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
    <!-- (dodaj inne, jeśli potrzebujesz np. firestore, storage itp.) -->

    <!-- Twój skrypt JS -->
    <script src="../js/firebase.js" defer></script>
</head>
<body>
    <div class="profileSettingsMainContainer">
        <button>darkmode<img src="../assets/img/moon-regular.svg"></button>
        <div class="navBar">
            <ul>
                <li><a href="dashboardPage.html">Minutnik</a></li>
                <li><a href="profilePage.html">Profil</a></li>
            </ul>
        </div>
        <div class="userProfile">
            <div class="profileHeader">
                <div class="avatar"><img src="../assets/img/user-solid.svg"></div>
                <div class="userName">@Typowy_user</div>
            </div>
            <div class="settingsContainer">
                <a href="profilePage.html">Wróć do profilu</a>
                <form>
                <label>Zmień zdjęcie profilowe:</label>
                    <input type="file" id="avatarFile" name="avatarFile"></input>
                    <input type="submit" value="Potwierdź"></input>
                <label>Zmień adres e-mail:</label>
                    <input type="text"></input>
                    <input type="submit" value="Potwierdź"></input>
                <label>Zmień nazwę użytkownika:</label>
                    <input type="text"></input>
                    <input type="submit" value="Potwierdź"></input>
                <label>Zmień hasło:</label>
                    <input type="text" placeholder="Podaj stare hasło"></input>
                    <input type="text" placeholder="Podaj nowe hasło"></input>
                    <input type="submit" value="Potwierdź"></input>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
