    <div class="dashboardMainContainer">
        <button class="darkmode-toggle">
            <img src="../assets/img/moon-regular.svg" alt="Tryb nocny" class="moon-icon" />
            <img src="../assets/img/sun-solid-white.svg" alt="Tryb dzienny" class="sun-icon" />
            </button>

        <div class="timerContainer">
            <div class="message"></div>
            <div class="timerInfo">
                <p>✨Ustaw jak długo ma trwać twoja sesja skupienia, a minutnik sam dobierze odpowiednią długość przerwy!✨</p>
            </div>
            <div class="timer"></div> 
                <div class="timerControls">
                    <div class="topRow">
                        <button class="subtractTime"><span class="gradient-text">-</span></button>
                        <button class="addTime"><span class="gradient-text">+</span></button>
                    </div>

                    <div class="bottomRow">
                        <button class="startTimer"><span class="gradient-text">Start</span></button>
                        <button class="stopTimer"><span class="gradient-text">Stop</span></button>
                        <button class="resetTimer"><span class="gradient-text">Resetuj</span></button>
                    </div>
                    <div class="timerPresets">
                        <button id="FifteenMinutes"><span class="gradient-text">15 min</span></button>
                        <button id="ThirtyMinutes"><span class="gradient-text">30 min</span></button>
                        <button id="FortyFiveMinutes"><span class="gradient-text">45 min</span></button>
                    </div>
                </div>
        </div>
        <footer><a href="tipsSources.html" style="color: red;">Źródła</a></footer>

        <div class="musicPlayerWrapper">
            <button class="togglePlayer">⮟</button>
                <div class="musicPlayer">
                    <div class="songInfo">
                        <p class="songTitle">Artur_Aravidi_Music - Midnight</p>
                    </div>

                    <audio src="../assets/songs/Artur_Aravidi_Music - Midnight.mp3" class="audio"></audio>

                    <div class="songNavigation">
                        <button class="previousSong">
                            <img src="../assets/img/backward-solid-full.svg">
                            
                        </button>

                        <button class="playStop">
                            <img src="../assets/img/play-solid-full.svg" class="playSong">
                            <img src="../assets/img/pause-solid-full.svg" class="pauseSong">
                            
                        </button>

                        <button class="nextSong">
                            <img src="../assets/img/forward-solid-full.svg">
                            
                        </button>
                    </div>
                </div>
        </div>
        <div class="logoutWrapper">
            <button class="logoutBtn">
                <img src="../assets/img/login.svg" alt="Wróć do logowania">
            </button>
        </div>
    </div>
