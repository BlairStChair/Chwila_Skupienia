<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chwila Skupienia</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="registrationMainContainer">
        <button>darkmode<img src="../assets/img/moon-regular.svg"></button>
        <div class="title">
            <h1>Chwila </br> Skupienia</h1>
        </div>
        <div class="loginForm">
            <img src="../assets/img/diament-diament.svg"><h2>Zarejestruj się</h2>
            <a href="loginPage.html">Powrót do logowania</a>
            <form>
                <input type="email" class="newUserEmail" placeholder="Adres E-mail">
                <input type="text" class="newUserName" placeholder="Nazwa użytkownika">
                <input type="password" class="newUserPassword" placeholder="Hasło">
                <input type="password" class="newUserPasswordConfirm" placeholder="Powtórz Hasło">
                <button type="submit">Zarejestruj się</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- Twoje skrypty -->
<script src="../js/firebase.js" defer></script> 
<script src="../js/registerUser.js" defer></script> 
</body>
</html>
