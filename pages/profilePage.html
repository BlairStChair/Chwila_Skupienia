<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chwila Skupienia</title>
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
    <!-- (dodaj inne, jeśli potrzebujesz np. firestore, storage itp.) -->

    <!-- Twój skrypt JS -->
    <script src="../js/firebase.js" defer></script>
</head>
<body>
    <div class="profileMainContainer">
        <button>darkmode<img src="../assets/img/moon-regular.svg"></button>
        <div class="navBar">
            <ul>
                <li><a href="dashboardPage.html">Minutnik</a></li>
                <li><a href="profilePage.html">Profil</a></li>
            </ul>
        </div>
        <div class="userProfile">
            <div class="profileHeader">
                <div class="avatar"><img src="../assets/img/user-solid.svg"></div>
                <div class="userName">@Typowy_user</div>
                <div class="settings"><a href="profileSettings.html"><img src="../assets/img/gear-solid.svg"></a></div>
            </div>
            <div class="profileStatistics">
                <div class="weeklyStatistics">
                    <h1>Ten Tydzień</h1>
                </div>
                <div class="monthlyStatistics">
                    <h1>Ten Miesiąc</h1>
                </div>
            </div>
            <div class="profileTodoList">
                <h1>Cele</h1>
                <input type="text" class="taskName" placeholder="Podaj nazwę zadania">
                <button type="submit" class="addTask">+</button>
                <div class="taskList">

                </div>
            </div>
            <div class="friendsList">
                <h1>Znajomi</h1>
                <ul>
                    <li>Twoi znajomi</li>
                    <li>Wyszukaj użytkownika</li>
                    <li>Zaproszenia</li>
                </ul>
                <h2>Twoi znajomi</h2>
                <ul class="userFriendsList">

                </ul>
            </div>
        </div>
    </div>

    <script src="../js/todoList.js"></script>
</body>
</html>
