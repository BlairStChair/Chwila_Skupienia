<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chwila Skupienia</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="loginMainContainer">
                    <button class="darkmode-toggle">
                    <img src="../assets/img/moon-regular.svg" alt="Tryb nocny" class="moon-icon" />
                    <img src="../assets/img/sun-solid-white.svg" alt="Tryb dzienny" class="sun-icon" />
                </button>
            <div class="center">
                
                    <div class="title">
                        <h1>Chwila Skupienia</h1>
                    </div>

                        <div class="loginForm">
                                <div class="header-wrapper">
                                    <img src="../assets/img/diament-diament-white.svg" alt="diament" class="header-icon" />
                                    <h2>Przypomnij Hasło</h2>
                                </div>
                            <div class="decor-line"></div>

                            <form>

                                <div class="input-wrapper">
                                <img src="../assets/img/diament.svg" alt="diament" />
                                <input type="email" class="userEmail" placeholder="Adres e-mail">
                                </div>
                                <div class="link">
                                <a href="loginPage.html" class="button-link2">Powrót do logowania</a>
                                </div>
                                <div class="btn-wrapper">
                                <button type="submit" class="gradient-btn">
                                <span class="gradient-text">Wyślij wiadomość do zmiany hasła</span>
                                </button>
                                </div>

                            </form>
                        </div>
            </div>
            
    </div>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script src="../js/firebase.js"></script> 
    <script src="../js/passwordRemind.js"></script> 

</body>
</html>
