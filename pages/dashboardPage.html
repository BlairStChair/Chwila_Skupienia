<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chwila Skupienia</title>
    <link rel="stylesheet" href="../css/styles.css">

</head>
<body>
    <div class="dashboardMainContainer">
        <button>darkmode<img src="../assets/img/moon-regular.svg"></button>
        <button class="logoutBtn">Wyloguj się</button>
        <div class="navBar">
            <ul>
                <li><a href="dashboardPage.html">Minutnik</a></li>
                <li><a href="profilePage.html">Profil</a></li>
            </ul>
        </div>
        <div className="timerContainer">
            <div className="timerInfo">
                <p>Ustaw jak długo ma trwać twoja sesja skupienia, a minutnik sam dobierze odpowiednią długość przerwy!</p>
            </div>
            <div className="timer">
                00:00
            </div>

            <button class="subtractTime">-</button>

            <div className="message">
            </div>
        </div>
        <div class="musicPlayer">
            Odtwarzacz muzyki
        </div>
    </div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
