<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chwila Skupienia</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
</head>
<body>
    <div class="profileMainContainer">
        <button class="darkmode-toggle">
            <img src="../assets/img/moon-regular.svg" class="moon-icon" />
            <img src="../assets/img/sun-solid-white.svg" class="sun-icon" />
        </button>
        <div class="navBar">
            <div class="navBar-wrapper">
                <img class="diamond" src="../assets/img/diament-white.svg" />
                <a href="dashboardPage.html" class="navBtn">Minutnik</a>
                <img class="bigdiamond" src="../assets/img/diament-diament-white.svg" />
                <a href="profilePage.html" class="navBtn">Profil</a>
                <img class="diamond" src="../assets/img/diament-white.svg" />
            </div>
        </div>
        <div class="nav-lines">
            <div class="nav-decor-line"></div>
        </div>
        <div class="userProfile">
            <div class="profileHeader">
                <div class="left">
                        <div class="avatar"><img id="avatarImg" src="../assets/img/user-solid.svg"></div>
                        <div class="username">@ placeholder</div>
                    </div>
                <div class="settings">
                    <a href="profilePage.html" class="button-link2">Wróć do profilu</a>
                </div>
            </div>
            <div class="profiledecorline"></div>
            <div class="profileStatistics">
                <div class="weeklyStatistics">
                    <div class="weeklyStatisticsHeader">
                        <div class="header-wrapper">
                            <img class="bigdiamond" src="../assets/img/diament-diament.svg">
                            <h1>Ten Tydzień</h1>
                        </div>
                    </div>
                    <div class="weeklyStatisticsContent">
                            <canvas id="weeklyChart" style="width:100%;max-width:700px"></canvas>
                    </div>
               <div class="monthlyStatistics">
                        <div class="monthlyStatisticsHeader">
                            <div class="header-wrapper">
                                <img class="bigdiamond" src="../assets/img/diament-diament.svg">
                                <h1>Ten Miesiąc</h1>
                            </div>
                        </div>
                        <div class="monthlyStatisticsContent">
                            <ol id="monthlyRankingList"></ol>
                        </div>
                    </div>
            </div>
        </div>
    </div>

        <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script src="../js/firebase.js"></script>
    <script src="../js/charts.js"></script>
    <script src="../js/ranking.js" defer></script>
    <script src="../js/diffrentUserProfileLoad.js"></script>
    
    
    <!-- <script src="../js/displayUsernameAvatar.js"></script> -->
    
    <!-- <script src="../js/loginUser.js"></script>  -->
    <!-- <script src="../js/friendsList.js"></script> -->
</body>
</html>
