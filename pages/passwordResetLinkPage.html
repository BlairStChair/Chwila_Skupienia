<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chwila Skupienia</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="loginMainContainer">
        <button>darkmode<img src="../assets/img/moon-regular.svg"></button>
        <div class="title">
            <h1>Chwila </br> Skupienia</h1>
        </div>
        <div class="loginForm">
            <img src="../assets/img/diament-diament.svg"><h2>Zresetuj hasło</h2>
            <form>
                <input type="password" class="passwordAfterReset" placeholder="Nowe hasło">
                <input type="password" class="passwordAfterResetConfirm" placeholder="Wpisz nowe hasło ponownie">
                <button type="submit" class="passwordResetBtn">Zmień hasło</button>
            </form>
        </div>
    </div>
    <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="../js/firebase.js"></script> 
<script src="../js/passwordRemind.js"></script> 

</body>
</html>
